name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v6
        with:
          go-version: 1.26.5
          cache: true
      - run: go generate ./internal/projection
      - run: git diff --exit-code -- internal/projection/projection_generated.go
      - run: env GOMAXPROCS=2 GOGC=50 go test -p 1 -race ./...
      - run: env GOMAXPROCS=2 GOGC=50 go vet ./...
      - run: go build -buildvcs=false -trimpath ./cmd/gtfs-rt-archiver

  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
